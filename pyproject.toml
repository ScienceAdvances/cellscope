[project]
name = "cellscope"
version = "1.3.0"
description = "Single-cell transcriptome analysis toolkit"
authors = [{ name = "生信探索 BioQuest", email = "yehior@qq.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies=[
"numpy>=1.24",
"pandas>=2",
"scipy>=1.11",
"anndata>=0.10",
"mudata>=0.3",
"scanpy>=1.10",
"matplotlib>=3.8"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
r = []
ambient = ["pysoupx>=0.1.0"]
normalization = ["sctransform>=0.2.0"]
annotation = ["celltypist>=1.7"]
batch = ["harmonypy>=0.0.10", "bbknn>=1.6"]
trajectory = ["scvelo>=0.3", "palantir>=1.4"]
slingshot = ["pyslingshot>=0.2.0", "scanpy>=1.10,<1.12"]
glmpca = ["glmpca>=0.1.0"]
composition = ["pertpy[jax]>=1.4", "scanpy>=1.12"]
perturbation = ["pertpy>=1.4", "scanpy>=1.12"]
communication = ["liana>=1.5", "nichenetpy>=1.0.2"]
grn = ["arboreto>=0.1.6", "pyscenic>=0.12", "setuptools<81"]
best-practices = ["pysoupx>=0.1.0", "sctransform>=0.2.0", "celltypist>=1.7",
                  "harmonypy>=0.0.10", "bbknn>=1.6", "scvelo>=0.3", "palantir>=1.4",
                  "pertpy[jax]>=1.4", "scanpy>=1.12", "liana>=1.5", "nichenetpy>=1.0.2"]
integration = ["scvi-tools>=1.2"]
functional = ["decoupler>=2.0"]
differential = ["pydeseq2>=0.5", "decoupler>=2.0", "patsy>=1.0"]
limma = ["pylimma>=0.2.0", "edgepython>=0.2.6", "decoupler>=2.0", "patsy>=1.0"]
edger = ["edgepython>=0.2.6", "decoupler>=2.0", "patsy>=1.0"]
de = ["pydeseq2>=0.5", "pylimma>=0.2.0", "edgepython>=0.2.6", "decoupler>=2.0", "patsy>=1.0"]
clustering = ["igraph>=0.11", "leidenalg>=0.10"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1"]

[project.urls]
Homepage = "https://github.com/ScienceAdvances/cellscope"

[tool.hatch.build.targets.wheel]
packages = ["cellscope"]

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.ruff]
target-version = "py310"
line-length = 100


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
